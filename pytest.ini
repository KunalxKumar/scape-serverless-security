[pytest]
# Pytest configuration for SCAPE Engine testing

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum Python version
minversion = 7.0

# Output options
addopts = 
    --strict-markers
    --tb=short
    -ra

# Markers for categorizing tests
markers =
    unit: Unit tests for individual dimensions (C0-C5)
    integration: Integration tests (evaluate_event, etc.)
    adversarial: Adversarial scenario tests
    slow: Slow tests (stress tests, etc.)
    coverage: Coverage analysis
